# 상대 경로는 이 파일의 위치를 기준으로 해석한다.
data:  # 공통 입력 경로
  image_root: ../../../data/Udacity  # CSV의 image_path 앞에 붙일 원본 이미지 디렉터리
  validation: ../../splits/val.csv  # 매 에폭 체크포인트 선택에 사용할 Track 1 검증 목록
  test: ../../splits/test.csv  # 최종 평가에 사용할 Track 2 정면 이미지 목록
train_models:  # 이번 실행에서 학습할 모델 선택
  model_a: false  # Vanilla BC 학습 여부
  model_b: true  # Augmented BC 학습 여부
experiments:  # 모델별 학습 CSV
  model_a: ../../splits/train_a.csv  # 정면 영상과 기록된 조향값으로 학습
  model_b: ../../splits/train_b.csv  # 정면 및 측면 영상과 보정된 조향값으로 학습
output_dir: ../results  # 학습 시작 시각별 결과 폴더를 만들 상위 경로

preprocessing:  # 학습·검증·테스트에 공통 적용하는 영상 변환
  size: [224, 224]  # 전체 영상을 리사이즈할 [높이, 너비] (픽셀)
  mean: [0.485, 0.456, 0.406]  # 0~1 범위의 R, G, B에서 각각 뺄 ImageNet 평균
  std: [0.229, 0.224, 0.225]  # 평균을 뺀 각 채널을 나눌 ImageNet 표준편차

model:  # 조향값 하나를 출력하도록 마지막 fc 층을 교체할 모델
  architecture: resnet18  # torchvision 모델 이름 (fc 층을 사용하는 구조)
  weights: DEFAULT  # ResNet-18의 ImageNet-1K V1 가중치. null이면 무작위 초기화
training:  # 모델 학습 설정
  steering_delta: 1.0  # Model B 학습 전용. 기록값 기준 왼쪽 +δ, 오른쪽 −δ (0.0이면 보정 없음)
  seed: 42  # 각 실험 시작 시 초기화와 데이터 셔플에 사용할 난수 시드
  device: auto  # auto는 CUDA 사용 가능 시 GPU, 그 외에는 CPU. cpu, cuda:0 등 지정 가능
  epochs: 10  # 각 모델이 전체 학습 목록을 반복하는 횟수
  batch_size: 32  # 한 배치의 샘플 수. 검증·테스트에도 적용
  num_workers: 2  # DataLoader 작업 프로세스 수. 0이면 메인 프로세스에서 로드
  shuffle_train: true  # 고정된 Train 안에서 에폭마다 순서를 섞을지 여부
  loss: MSELoss  # torch.nn의 학습 손실 함수. 체크포인트 선택 기준은 항상 검증 MSE
  optimizer: Adam  # torch.optim의 최적화 알고리즘 이름
  optimizer_args:  # 선택한 옵티마이저에 전달할 인자
    lr: 0.0001  # 학습률
    betas: [0.9, 0.999]  # Adam의 그래디언트 1차·2차 모멘트 지수이동평균 계수
    eps: 1.0e-8  # Adam 분모의 수치 안정성을 위한 상수
    weight_decay: 0.0  # 가중치 감쇠 계수. 0이면 미적용

evaluation:  # 테스트 조향 분포 평가 설정
  after_training: true  # true이면 학습 직후 이번 실행의 모델을 OOD Test로 평가
  run_dir: "20261122_155143_272935"  # 수동 평가 시 사용할 시각 폴더 이름
  checkpoints:  # 수동 평가할 체크포인트 (선택한 폴더 기준)
    model_a: model_a/best.pt
    model_b: model_b/best.pt
  metrics_csv: metrics.csv  # 실행 폴더 기준 평가 지표 출력 경로
  histogram_csv: histogram.csv  # 실행 폴더 기준 히스토그램 출력 경로
  histogram_bins: 50  # 전문가와 모든 모델이 공유할 히스토그램 구간 수
  kl_pseudocount: 1.0e-8  # KL 계산 시 빈 구간도 양의 확률을 갖도록 각 빈도에 더할 값

plot:
  input_csvs:  # 범례에 표시할 실험 이름: config.yaml 기준 CSV 경로
    "delta=0.0": ../results/20261122_155143_272935/histogram.csv
    "delta=0.1": ../results/20261122_162637_800012/histogram.csv
    "delta=0.2": ../results/20261122_164356_136009/histogram.csv
    "delta=0.3": ../results/20261122_165557_297405/histogram.csv
    "delta=0.4": ../results/20261122_170759_223871/histogram.csv
    "delta=0.5": ../results/20261122_171916_985590/histogram.csv
    "delta=0.6": ../results/20261122_173624_894823/histogram.csv
    "delta=0.7": ../results/20261122_175243_281748/histogram.csv
    "delta=0.8": ../results/20261122_180415_110759/histogram.csv
    "delta=0.9": ../results/20261122_181509_543932/histogram.csv
    "delta=1.0": ../results/20261122_182729_964682/histogram.csv
  output_png: ../results/steering_overlay.png  # config.yaml 기준 출력 경로
  alpha: 0.85  # 분포선의 불투명도 (0~1)

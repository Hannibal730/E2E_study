data:
  image_root: ../../../../data/Udacity
  validation: ../../../splits/val.csv
  test: ../../../splits/test.csv
experiments:
  model_b: ../../../splits/train_b.csv
output_dir: ..
preprocessing:
  size:
  - 224
  - 224
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  architecture: resnet18
  weights: DEFAULT
training:
  steering_delta: 0.6
  seed: 42
  device: auto
  epochs: 10
  batch_size: 32
  num_workers: 2
  shuffle_train: true
  loss: MSELoss
  optimizer: Adam
  optimizer_args:
    lr: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
evaluation:
  after_training: true
  run_dir: .
  checkpoints:
    model_b: model_b/best.pt
  metrics_csv: metrics.csv
  histogram_csv: histogram.csv
  histogram_bins: 50
  kl_pseudocount: 1.0e-08
plot:
  input_csvs:
    delta=0.2: ../20261122_143500_442938/histogram.csv
  output_png: ../steering_overlay.png
  alpha: 0.85

data:
  image_root: ../../../../data/Udacity
  validation: ../../../splits/val.csv
  test: ../../../splits/test.csv
experiments:
  model_b: ../../../splits/train_b.csv
output_dir: ..
preprocessing:
  size:
  - 224
  - 224
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
model:
  architecture: resnet18
  weights: DEFAULT
training:
  left_delta: 1.0
  right_delta: -0.5
  seed: 42
  device: auto
  epochs: 10
  batch_size: 32
  num_workers: 2
  shuffle_train: true
  loss: MSELoss
  optimizer: Adam
  optimizer_args:
    lr: 0.0001
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
evaluation:
  after_training: true
  run_dir: .
  checkpoints:
    model_b: model_b/best.pt
  metrics_csv: metrics.csv
  histogram_csv: histogram.csv
  histogram_bins: 50
  kl_pseudocount: 1.0e-08
plot:
  input_csvs:
    delta=0.0: ../20261122_155143_272935/histogram.csv
    delta=0.1: ../20261122_162637_800012/histogram.csv
    delta=0.2: ../20261122_164356_136009/histogram.csv
    delta=0.3: ../20261122_165557_297405/histogram.csv
    delta=0.4: ../20261122_170759_223871/histogram.csv
    delta=0.5: ../20261122_171916_985590/histogram.csv
    delta=0.6: ../20261122_173624_894823/histogram.csv
    delta=0.7: ../20261122_175243_281748/histogram.csv
    delta=0.8: ../20261122_180415_110759/histogram.csv
    delta=0.9: ../20261122_181509_543932/histogram.csv
    delta=1.0: ../20261122_182729_964682/histogram.csv
  output_png: ../steering_overlay.png
  alpha: 0.85
